[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "proton-sync-ui"
version = "0.2.0"
description = "Fedora-native GTK4/libadwaita GUI für 2-Wege-Synchronisation und Backups mit Proton Drive über die offizielle proton-drive CLI"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "ProtonSyncUI Contributors" }]
keywords = ["proton-drive", "backup", "gtk4", "libadwaita", "fedora", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]

# Bewusst leer: Die Laufzeit nutzt ausschließlich die Python-Standardbibliothek.
# PyGObject/GTK4/libadwaita kommen als Systempakete über dnf (siehe README),
# NICHT über pip -- ein pip-Build von PyGObject würde gegen die falschen
# Systembibliotheken linken.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/protonsyncui/proton-sync-ui"
Issues = "https://github.com/protonsyncui/proton-sync-ui/issues"

[project.scripts]
# Headless-Schnittstelle. Wird von den systemd-Units aufgerufen.
proton-sync-ui = "proton_sync_ui.cli.main:main"

[project.gui-scripts]
# Grafischer Einstiegspunkt. Wird von der .desktop-Datei aufgerufen.
proton-sync-ui-gui = "proton_sync_ui.ui.application:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proton_sync_ui"]

[tool.hatch.build.targets.wheel.force-include]
"src/proton_sync_ui/storage/schema.sql" = "proton_sync_ui/storage/schema.sql"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/systemd",
    "/data",
    "/README.md",
    "/LICENSE",
]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez -- erzwingt zeitzonenbewusste datetimes
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PL",     # pylint
    "RUF",    # ruff-spezifisch
    "S",      # flake8-bandit -- Sicherheitsregeln
]
ignore = [
    "PLR0913",  # zu viele Argumente -- bei Datenklassen-Konstruktoren erwartet
    "PLR0911",  # zu viele returns -- Kommando-Dispatch und Fehlereinordnung
    "PLR0912",  # zu viele Zweige -- dito
    "PLR0915",  # zu viele Anweisungen -- Parserbau und UI-Aufbau sind linear
    "PLR2004",  # "magische" Zahlen -- 1024 als Byte-Faktor liest sich besser
                # als eine Konstante
    "RUF001",   # mehrdeutige Zeichen -- die deutschen Texte verwenden bewusst
                # typografische Zeichen (Gedankenstrich, Anführungszeichen)
    "S101",     # assert -- in Tests erwünscht
]

[tool.ruff.lint.per-file-ignores]
# Tests konstruieren absichtlich Subprocess-Aufrufe, /tmp-Pfade und
# gefährlich aussehende Dateinamen, um zu belegen, dass keine Shell beteiligt
# ist. Sie greifen zudem auf Interna zu, um Zusagen zu prüfen.
"tests/**/*.py" = [
    "S603",     # subprocess-Aufruf ohne Prüfung
    "S607",     # Teilpfad im Prozessstart
    "S108",     # fest verdrahtete /tmp-Pfade
    "S311",     # random ohne kryptografische Eignung (Jitter-Test)
    "ARG001",
    "ARG002",
    "PLC0415",  # späte Imports in einzelnen Testfällen
    "SIM300",
    "SIM905",
]
# Die GTK-Schicht folgt GObject-Namenskonventionen (do_activate etc.).
"src/proton_sync_ui/ui/**/*.py" = ["N802"]

[tool.ruff.lint.flake8-bandit]
# subprocess ist der Kern dieser Anwendung. Sie wird ausschließlich mit
# Argumentlisten und ohne shell=True verwendet; das erzwingt zusätzlich
# tests/test_cli_adapter.py.
check-typed-exception = true

[tool.ruff.lint.isort]
known-first-party = ["proton_sync_ui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "gtk: Tests, die eine importierbare GTK4-/libadwaita-Umgebung benötigen",
]
filterwarnings = [
    # Warnungen sind grundsätzlich Fehler -- kein stiller Drift.
    "error",
    # Ausnahme: PyGObject meldet beim Laden seiner Overrides eigene
    # Veraltungen (z. B. GLib.unix_signal_add_full). Das passiert innerhalb
    # von gi selbst und ist von diesem Projekt nicht beeinflussbar.
    "ignore::gi.PyGIDeprecationWarning",
]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src/proton_sync_ui"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
# PyGObject bringt keine Typinformationen mit: Gtk, Adw und GLib sind für mypy
# durchweg "Any". Deshalb wird die UI-Schicht nachsichtiger geprüft --
# insbesondere Ableitungen von GObject-Klassen und Rückgaben aus gi-Aufrufen.
# Der Kern (models, storage, cli_adapter, sync, systemd, cli) bleibt strikt.
module = ["gi.*", "proton_sync_ui.ui.*"]
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_subclassing_any = false
warn_return_any = false
